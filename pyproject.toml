[tool.poetry]
name = "jarvis"
version = "0.1.0"
description = "Jarvis AI Operating System"
authors = ["Nathan Grainger <hghnathangrainger@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14"
anthropic = ">=0.112.0,<0.113.0"
openai = ">=1.0.0,<2.0.0"
google-genai = ">=1.0.0,<2.0.0"
sqlalchemy = ">=2.0.51,<3.0.0"
pydantic = ">=2.13.4,<3.0.0"
python-dotenv = ">=1.2.2,<2.0.0"
duckduckgo-search = ">=8.1.1,<9.0.0"
httpx = ">=0.28.1,<0.29.0"
chromadb = ">=0.5.0,<1.0.0"
faster-whisper = ">=1.1.0,<2.0.0"
pyttsx3 = ">=2.90,<3.0.0"
sounddevice = ">=0.5.0,<1.0.0"
numpy = ">=1.26.0,<3.0.0"
pyautogui = ">=0.9.54,<1.0.0"
pygetwindow = ">=0.0.9,<1.0.0"
psutil = ">=6.0.0,<7.0.0"
mss = ">=9.0.0,<10.0.0"
pytesseract = ">=0.3.10,<1.0.0"
Pillow = ">=10.0.0,<12.0.0"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = { version = ">=0.34.0,<1.0.0", extras = ["standard"] }
python-jose = { version = ">=3.3.0,<4.0.0", extras = ["cryptography"] }
passlib = { version = ">=1.7.4,<2.0.0", extras = ["bcrypt"] }
websockets = ">=14.0,<16.0"
jinja2 = ">=3.1.0,<4.0.0"
aiofiles = ">=24.1.0,<25.0.0"
firebase-admin = ">=6.0.0,<7.0.0"
ollama = ">=0.4.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
black = ">=26.5.1,<27.0.0"
ruff = ">=0.15.20,<0.16.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
