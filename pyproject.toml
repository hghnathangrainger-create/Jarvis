[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis AI Operating System"
authors = [
    {name = "Nathan Grainger",email = "hghnathangrainger@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic (>=0.112.0,<0.113.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "duckduckgo-search (>=8.1.1,<9.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)"
]
